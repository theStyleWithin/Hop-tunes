<?xml version="1.0" encoding="UTF-8"?>
<!-- Hop-tunes app icon: Notesy, the Hop-tunes mascot, winking. Original artwork, GPL-3.0-or-later (same as the app). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe0d4"/><stop offset="1" stop-color="#2fb3ad"/>
    </linearGradient>
    <radialGradient id="body" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe98a"/><stop offset="0.65" stop-color="#ffc83d"/><stop offset="1" stop-color="#e6a21a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity="0.55"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="none" stroke="#111113" stroke-opacity="0.12" stroke-width="4"/>
  <g transform="translate(128 128) scale(1.1) translate(-120 -127)">
  <circle cx="112" cy="160" r="104" fill="url(#glow)"/>
  <!-- wings -->
  <ellipse cx="55" cy="146" rx="26" ry="38" fill="#fff" fill-opacity="0.95" transform="rotate(-22 55 146)"/>
  <ellipse cx="170" cy="158" rx="22" ry="32" fill="#fff" fill-opacity="0.95" transform="rotate(22 170 158)"/>
  <!-- stem and flag -->
  <path d="M150 128 V62" fill="none" stroke="#ffc83d" stroke-width="15" stroke-linecap="round"/>
  <path d="M150 62 C196 60 210 92 182 124 C190 94 176 80 150 80 Z" fill="#ffc83d" stroke="#ffc83d" stroke-width="4" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="112" cy="160" r="50" fill="url(#body)"/>
  <circle cx="112" cy="160" r="50" fill="none" stroke="#b97d0b" stroke-opacity="0.35" stroke-width="3"/>
  <!-- cheeks -->
  <ellipse cx="84" cy="170" rx="9.5" ry="6.5" fill="#ff7aa2" fill-opacity="0.65"/>
  <ellipse cx="140" cy="170" rx="9.5" ry="6.5" fill="#ff7aa2" fill-opacity="0.65"/>
  <!-- left eye open, big and sparkly -->
  <ellipse cx="94" cy="152" rx="9" ry="13" fill="#2b2140"/>
  <circle cx="97" cy="146" r="3.6" fill="#fff"/><circle cx="91.5" cy="157.5" r="1.9" fill="#fff"/>
  <!-- right eye winking: a happy upward curve -->
  <path d="M121 154 Q130 141 140 154" fill="none" stroke="#2b2140" stroke-width="5.5" stroke-linecap="round"/>
  <!-- little smile -->
  <path d="M104 172 Q112 181 121 172" fill="none" stroke="#2b2140" stroke-width="4" stroke-linecap="round"/>
  <!-- two tiny sparkles -->
  <path d="M60 92 l2.6 -8 l2.6 8 l8 2.6 l-8 2.6 l-2.6 8 l-2.6 -8 l-8 -2.6 z" fill="#fff" fill-opacity="0.9"/>
  <path d="M196 150 l1.8 -5.5 l1.8 5.5 l5.5 1.8 l-5.5 1.8 l-1.8 5.5 l-1.8 -5.5 l-5.5 -1.8 z" fill="#fff" fill-opacity="0.8"/>
  </g>
</svg>
