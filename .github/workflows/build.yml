name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev \
            libtag1-dev libsqlite3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qt-labs-folderlistmodel dbus

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        # logged.sh repeats the failing output as an annotation, readable through the API.
        run: .github/scripts/logged.sh ctest ctest --test-dir build --output-on-failure

  # Real makepkg + namcap on Arch, with this checkout as the release tarball.
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch build tools and dependencies
        run: |
          for i in 1 2 3; do pacman -Syu --noconfirm --needed base-devel git namcap cmake ninja \
            qt6-base qt6-declarative taglib sqlite glib2 gstreamer gst-plugins-base gst-plugins-good \
            hicolor-icon-theme && break; sleep 15; done
      - uses: actions/checkout@v5
      - name: makepkg hop-tunes
        run: |
          set -e
          ver=$(sed -n 's/^project(hop-tunes VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          useradd -m builder
          mkdir -p /tmp/pkg
          cp packaging/aur/hop-tunes/PKGBUILD /tmp/pkg/
          tar czf "/tmp/pkg/hop-tunes-$ver.tar.gz" --exclude=./.git --transform "s,^\.,Hop-tunes-$ver," .
          sed -i "s|^pkgver=.*|pkgver=$ver|; s|^source=.*|source=(\"hop-tunes-$ver.tar.gz\")|" /tmp/pkg/PKGBUILD
          chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg --noconfirm --nodeps -f" 2>&1 | tail -40
          ls /tmp/pkg/*.pkg.tar.zst
      - name: namcap and install
        run: |
          set -e
          namcap packaging/aur/hop-tunes/PKGBUILD packaging/aur/hop-tunes-git/PKGBUILD || true
          namcap /tmp/pkg/*.pkg.tar.zst || true
          pacman -U --noconfirm /tmp/pkg/*.pkg.tar.zst
          hop-tunes --version
          test -f /usr/share/metainfo/io.github.thestylewithin.hoptunes.metainfo.xml
          test -f /usr/share/man/man1/hop-tunes.1.gz || test -f /usr/share/man/man1/hop-tunes.1
